name: UnBiased Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Runs every 5 minutes during market hours (Mon–Fri)
    # 13:30–20:00 UTC = 9:30 AM – 4:00 PM EST
    - cron: "*/5 13-20 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # =========================
      # DATA + ALERTS
      # =========================
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      DISCORD_WEBHOOK_FREE: ${{ secrets.DISCORD_WEBHOOK_FREE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # =========================
      # ALPACA (BROKER)
      # =========================
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}

      # =========================
      # CORE BOT CONTROL
      # =========================
      LIVE_TRADING: "false"        # 🔴 change to "true" to enable execution
      POLL_SECONDS: "60"

      # =========================
      # EXECUTION ENGINE SETTINGS
      # =========================
      A_PLUS_ONLY_MODE: "false"
      ALLOW_B_MICRO_SIZE: "true"

      DEFAULT_ORDER_QTY: "1"
      B_MICRO_QTY: "1"

      CHASE_DISTANCE_PCT: "0.15"
      MIN_RSI_CALL: "55"
      MAX_RSI_PUT: "45"
      MIN_CONFIDENCE: "0.75"

      PNL_LOG_FILE: "trade_log.csv"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests alpaca-py

      - name: Run trading bot
        run: |
          python main.py
