name: UnBiased Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-20 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}

      LIVE_TRADING: "false"
      POLL_SECONDS: "60"

      A_PLUS_ONLY_MODE: "false"
      ALLOW_B_MICRO_SIZE: "true"
      DEFAULT_ORDER_QTY: "1"
      B_MICRO_QTY: "1"

      CHASE_DISTANCE_PCT: "0.15"
      MIN_RSI_CALL: "55"
      MAX_RSI_PUT: "45"
      MIN_CONFIDENCE: "0.75"

      PNL_LOG_FILE: "trade_log.csv"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests alpaca-py

      - name: Run bot
        run: |
          python main.py
