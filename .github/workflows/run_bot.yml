name: Telegram Control Center

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-control-center
  cancel-in-progress: false

jobs:
  telegram-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure state files exist
        run: |
          [ -f control_state.json ] || echo '{"bot_paused": false, "kill_switch": false, "flatten_requested": false, "armed": true, "mode": "paper", "last_command": "none", "last_command_time_utc": null, "last_command_from": null, "notes": "initialized"}' > control_state.json
          [ -f telegram_offset.txt ] || echo "0" > telegram_offset.txt

      - name: Run Telegram control center
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_MODE: "true"
          BOT_NAME: "Heartbeat Command Center"
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add control_state.json telegram_offset.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Telegram control state"
            git push
          fi
