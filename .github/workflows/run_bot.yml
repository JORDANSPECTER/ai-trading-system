name: UnBiased Bot Runner

on:
  workflow_dispatch:
    inputs:
      bot_mode:
        description: "Choose mode (trade_alert, live_update, daily_report, weekly_report, dashboard, test_all)"
        required: false
        default: "test_all"

  schedule:
    # Daily report → 9:00 PM EST (adjust if needed)
    - cron: "0 1 * * *"

    # Weekly report → Sunday 7:00 PM EST
    - cron: "0 23 * * 0"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      # ===== BOT MODE LOGIC =====
      BOT_MODE: ${{ github.event.inputs.bot_mode }}

      # ===== TELEGRAM =====
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ===== DISCORD =====
      DISCORD_WEBHOOK_FREE: ${{ secrets.DISCORD_WEBHOOK_FREE }}
      DISCORD_WEBHOOK_PREMIUM: ${{ secrets.DISCORD_WEBHOOK_PREMIUM }}
      DISCORD_WEBHOOK_PREMIUM_LEVELS: ${{ secrets.DISCORD_WEBHOOK_PREMIUM_LEVELS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # ===== AUTO MODE SWITCHING =====
      - name: Set BOT_MODE for scheduled runs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Daily run
            if [[ "$(date +%u)" != "7" ]]; then
              echo "BOT_MODE=daily_report" >> $GITHUB_ENV
            fi

            # Sunday = weekly report
            if [[ "$(date +%u)" == "7" ]]; then
              echo "BOT_MODE=weekly_report" >> $GITHUB_ENV
            fi
          fi

      - name: Run UnBiased Bot
        run: python main.py
