name: UnBiased Bot Runner

on:
  workflow_dispatch:
    inputs:
      bot_mode:
        description: "Choose mode (trade_alert, live_update, daily_report, weekly_report, dashboard, email_weekly, test_all)"
        required: false
        default: "test_all"

  schedule:
    - cron: "0 1 * * *"
    - cron: "0 23 * * 0"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      BOT_MODE: ${{ github.event.inputs.bot_mode }}

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      DISCORD_WEBHOOK_FREE: ${{ secrets.DISCORD_WEBHOOK_FREE }}
      DISCORD_WEBHOOK_PREMIUM: ${{ secrets.DISCORD_WEBHOOK_PREMIUM }}
      DISCORD_WEBHOOK_PREMIUM_LEVELS: ${{ secrets.DISCORD_WEBHOOK_PREMIUM_LEVELS }}

      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Set BOT_MODE for scheduled runs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "$(date +%u)" == "7" ]]; then
              echo "BOT_MODE=email_weekly" >> $GITHUB_ENV
            else
              echo "BOT_MODE=daily_report" >> $GITHUB_ENV
            fi
          fi

      - name: Run UnBiased Bot
        run: python main.py

      - name: Upload trade logs
        uses: actions/upload-artifact@v4
        with:
          name: unbiased-trade-logs
          path: artifacts/
          if-no-files-found: warn
